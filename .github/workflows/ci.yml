name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - name: Resolve MoonBit dependencies
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
          moon update
      - name: Validate preferred target
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
          moon info
          moon check --deny-warn
          moon test --deny-warn --no-parallelize
          moon build --deny-warn
          moon package --list
